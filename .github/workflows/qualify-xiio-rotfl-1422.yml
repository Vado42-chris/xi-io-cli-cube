name: qualify xi-io.net PR1422 exact head
on:
  push:
    branches: [fix/native-hex-plugin-catalog-20261028]
    paths:
      - '.github/workflows/qualify-xiio-rotfl-1422.yml'
      - '.ci/xiio1422/**'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax exact staged owner files
        run: |
          set -euo pipefail
          bash -n .ci/xiio1422/scripts/xiio-rotfl-autopilot
          python3 -m py_compile .ci/xiio1422/scripts/rotfl-successor-wake.py
      - name: Run exact hostile bundle
        working-directory: .ci/xiio1422
        run: bash scripts/validate-rotfl-yield-hostile-bundle.sh
