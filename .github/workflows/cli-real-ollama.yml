name: HEX current CLI real Ollama proof

on:
  pull_request:
    paths:
      - 'native/hex/cli-source/**'
      - 'native/hex/COMPOSED-packaged-source.receipt.json'
      - '.github/workflows/cli-real-ollama.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-ollama:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'

      - name: Verify exact packaged runtime before inference
        run: |
          set -euo pipefail
          python3 native/hex/cli-source/test_packaged_chat_first.py
          # The custody test above checks the exact source pin and every file digest.
          node --check native/hex/cli-source/src/xiio.mjs

      - name: Install real local Ollama and PTY driver
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo apt-get update -qq
          sudo apt-get install -y python3-pexpect
          python3 -B native/hex/cli-source/test_real_ollama_qualification.py
          python3 -B native/hex/cli-source/test_installed_ollama_qualification.py
          python3 -B native/hex/cli-source/test_installed_evidence_custody.py
          ollama --version

      - name: Start Ollama and pull bounded local model
        run: |
          set -euo pipefail
          # The official installer starts this service. Stop only that disposable
          # runner service before owning the proof server and its request log.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo systemctl stop ollama.service
          nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          ollama_pid=$!
          echo "$ollama_pid" >"$RUNNER_TEMP/ollama.pid"
          for i in $(seq 1 60); do
            kill -0 "$ollama_pid"
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          kill -0 "$ollama_pid"
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:1.5b
          kill -0 "$ollama_pid"
          ollama list

      - name: Installed Ollama transaction, saved-chat restart, and rollback reopen
        env:
          XIIO_MODEL: qwen2.5:1.5b
          XIIO_TOOL_MODE: structured
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/xiio-real-ollama"
          # The driver creates a fresh private bench, uses the real packaged
          # installer, then invokes only its generated launcher. Existing benches
          # refuse, so an approved failure cannot be reset into a passing retry.
          XIIO_PROOF_ROOT="$work" python3 -B native/hex/cli-source/qualify_real_ollama.py
          python3 -B native/hex/cli-source/verify_installed_evidence_custody.py --root "$work"
          test "$(cat "$work/project/NOTE.txt")" = "status: new"
          test "$(stat -c '%a' "$work/bin/xi-io-cli")" = "755"
          test "$(stat -c '%a' "$work/evidence-custody.json")" = "600"
          sha256sum "$work/project/NOTE.txt" | tee "$work/note.sha256"
          cp "$RUNNER_TEMP/ollama.log" "$work/ollama.log"
          cp "$work/transcript.txt" "$work/transcript.redacted.txt"
          sed -i -E 's/(token|secret|password|authorization)[^[:space:]]*/[redacted]/Ig' "$work/transcript.redacted.txt"

      - name: Assert no paid-provider route participated
        run: |
          set -euo pipefail
          runtime=native/hex/cli-source/src/xiio.mjs
          grep -Fq 'http://127.0.0.1:11434/api/chat' "$runtime"
          ! grep -Eiq 'api\.openai\.com|api\.anthropic\.com|generativelanguage\.googleapis\.com' "$runtime"
          echo "PAID_PROVIDER_FALLBACK=ABSENT_FROM_CHAT_RUNTIME"
          echo "REAL_LOCAL_OLLAMA=EXECUTED"

      - name: Preserve real-inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-cli-real-ollama-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xiio-real-ollama/transcript.txt
            ${{ runner.temp }}/xiio-real-ollama/transcript.redacted.txt
            ${{ runner.temp }}/xiio-real-ollama/note.sha256
            ${{ runner.temp }}/xiio-real-ollama/observed-NOTE.txt
            ${{ runner.temp }}/xiio-real-ollama/outcome.json
            ${{ runner.temp }}/xiio-real-ollama/*.json
            ${{ runner.temp }}/xiio-real-ollama/*.transcript.txt
            ${{ runner.temp }}/xiio-real-ollama/state/chat/*.json
            ${{ runner.temp }}/xiio-real-ollama/prefix/current
            ${{ runner.temp }}/xiio-real-ollama/prefix/previous
            ${{ runner.temp }}/xiio-real-ollama/prefix/versions/**
            ${{ runner.temp }}/xiio-real-ollama/bin/xi-io-cli
            ${{ runner.temp }}/xiio-real-ollama/config/**
            ${{ runner.temp }}/xiio-real-ollama/project/NOTE.txt
            ${{ runner.temp }}/xiio-real-ollama/proposal-*.txt
            ${{ runner.temp }}/ollama.log
            ${{ runner.temp }}/ollama.pid
            ${{ runner.temp }}/xiio-real-ollama/ollama.log
          if-no-files-found: warn
          retention-days: 14
