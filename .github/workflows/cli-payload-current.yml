name: HEX current CLI payload qualification
on:
  pull_request:
    paths:
      - 'native/hex/**'
      - 'tests/fixtures/cli-launcher-repair-pr15/**'
      - 'tests/cli-payload-qualification.test.mjs'
      - 'AGENTS.md'
      - '.github/workflows/cli-payload-current.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-payload:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify qualification entry and denominator
        run: node --test tests/cli-payload-qualification.test.mjs
      - name: Install PTY qualification dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pexpect
      - name: Qualify receiving CLI package
        shell: bash
        run: |
          set -euo pipefail
          for test_file in native/hex/cli-source/test_*.py native/hex/test_*.py; do
            test -f "$test_file"
            python3 -B "$test_file"
          done
          for test_name in test_adapter.py test_connection_delivery.py test_launcher_repair.py; do
            test -f "native/hex/adapter/$test_name"
            PYTHONPATH="$PWD/native/hex/adapter:$PWD/native/hex/adapter/kernel" python3 -B -m unittest discover -s native/hex/adapter -p "$test_name"
          done
          node --check native/hex/cli-source/src/xiio.mjs
          node --check native/hex/cli-source/install.mjs
      - name: Preserve evidence boundary
        run: |
          echo "HEX_PAYLOAD_SOURCE=QUALIFIED_HERE"
          echo "REAL_OLLAMA_INFERENCE=NOT_RUN_IN_HOSTED_CI"
          echo "ARIES_INSTALL=NOT_PERFORMED"
