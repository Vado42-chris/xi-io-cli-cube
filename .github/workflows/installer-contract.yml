name: XI-IO CLI Cube static contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck actual application
        run: npm run lint
      - name: Build actual application
        run: npm run build
      - name: Exercise positive and hostile cases, without dependencies
        run: node --test tests/installer-contract.test.mjs
      - name: Exercise Agent 3's pinned-command and current-source contract
        run: node --test test/installer-contract.test.mjs
      - name: Audit actual page and release configuration
        run: node scripts/verify-installer-contract.mjs
      - name: Check Cube continuation UI and receipt regressions
        run: node --test tests/cube-continuation.test.mjs tests/rollback-history.test.mjs test/rollback-history.test.mjs
