name: XI-IO CLI Cube static contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run source/parser regressions and explicitly labeled simulations
        run: npm test
      - name: Audit actual page and release configuration
        run: npm run test:contract

  bundled-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and bundle
        run: |
          npm run lint
          npm run build
      - name: Refuse generated server entrypoint or remote script tag
        run: |
          test -f dist/index.html
          test ! -e dist/server.js
          if grep -Ein '<(script|link)[^>]+(src|href)="https?://' dist/index.html; then
            echo "EXTERNAL_SCRIPT_OR_STYLESHEET_NOT_OFFLINE"
            exit 1
          fi
          echo "SOURCE_BUILD_PASS_NOT_HOST_INSTALL"
