name: XI-IO CLI Cube static contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Run source/parser regressions and explicitly labeled simulations
        run: |
          npm test
          npm run test:bindings
          npm run test:source-adoption
      - name: Qualify exact DEV9 bootstrap and guarded delivery
        run: |
          set -euo pipefail
          python3 deliveries/hex-dev/0.1.0-dev.9/qualification/test_bootstrap.py
      - name: Audit actual page and release configuration
        run: npm run test:contract

  bundled-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install exact locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and bundle
        run: |
          npm run lint
          npm run build
      - name: Verify real product navigation and shared-frame consumer
        run: npm run test:interaction
      - name: Refuse generated server entrypoint or remote script tag
        run: |
          test -f dist/index.html
          test ! -e dist/server.js
          if grep -Ein '<(script|link)[^>]+(src|href)="https?://' dist/index.html; then
            echo "EXTERNAL_SCRIPT_OR_STYLESHEET_NOT_OFFLINE"
            exit 1
          fi
          echo "SOURCE_BUILD_PASS_NOT_HOST_INSTALL"

  native-source-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact editable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install native build dependencies in the disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf python3
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Build the same root product frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
      - name: Test actual finite adapter and native carrier from editable sources
        run: npm run native:check
      - name: Keep source qualification distinct from installed device acceptance
        run: echo "SOURCE_NATIVE_TESTS_NOT_ARIES_INSTALL_OR_CONNECTION"

  installed-linux-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact version-pinned DEV9 Debian package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1 for the installed native client parser
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Fail closed outside an ephemeral GitHub Linux runner
        run: |
          set -euo pipefail
          bash -n deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh
          set +e
          GITHUB_ACTIONS=false bash deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh > guard.log 2>&1
          status=$?
          set -e
          test "$status" -eq 78
          grep -Fxq CI_EPHEMERAL_RUNNER_REQUIRED guard.log
      - name: Install, independently reopen and remove actual DEV9 package on disposable Linux
        run: bash deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh

  child-bundle-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable code and existing installer kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify child manifest downloader, real XDG transactions and hostile rollback
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s native/hex/adapter -p test_bundle.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s native/hex/adapter -p test_bundle_descriptor_join.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest native.hex.adapter.test_release_binding -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s native/hex/adapter -p test_launcher_repair.py -v
      - name: Verify user permission, server package start/readback and rollback contracts
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest native.hex.adapter.test_permission_profile native.hex.adapter.test_server_profile native.hex.adapter.test_build_server_package native.hex.adapter.kernel.test_runtime_binding native.hex.adapter.kernel.test_dependency_binding native.hex.adapter.kernel.test_dependency_service_generation_join native.hex.adapter.kernel.test_installer_34_currentness -v
      - name: Keep composed payload installation distinct from running product/remote authority
        run: |
          echo "CHILD_BUNDLE_SOURCE_AND_DISPOSABLE_FILESYSTEM_TEST_ONLY"
          echo "RUNNING_SERVICES=NOT_TESTED"
          echo "FIRST_PARTY_SESSION_AND_WARD=UNBOUND"
          echo "CUSTOMER_TWO_WAY_CONNECTION=NOT_PROVEN"

  maths-installed-window:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact HEX content and native generation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 24.22.1 for reproducible frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Qualify byte-identical maths and actual bundled DOM interaction
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/snap55-desktop.test.mjs
          npm run lint
          npm run build
          npm run test:interaction
          grep -Rq 'data-hex-snap55-workbench' dist/assets
      - name: Install native build and isolated GUI toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf python3 python3-pil cmake libpng-dev zlib1g-dev python3-gi gir1.2-atspi-2.0 at-spi2-core libayatana-appindicator3-dev xvfb xdotool scrot dbus-x11
          rustup toolchain install 1.99.1 --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.1
          npm ci --prefix native/hex/carrier --no-audit --no-fund
      - name: Read the pinned OCR engine source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tesseract-ocr/tesseract
          ref: 64eab6c457b2337dd690746a5fde5c222b40d5f8
          path: .ci-tools/tesseract
          persist-credentials: false
      - name: Read the pinned OCR image decoder source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: DanBloomberg/leptonica
          ref: 7e803e73511fbd320f01314c141d35d2b8491dde
          path: .ci-tools/leptonica
          persist-credentials: false
      - name: Build and bind exact OCR executable and language bytes
        run: |
          set -euo pipefail
          bash -n scripts/prepare-hex-ocr.sh
          bash scripts/prepare-hex-ocr.sh "$GITHUB_WORKSPACE/.ci-tools/tesseract" "$GITHUB_WORKSPACE/.ci-tools/leptonica"
      - name: Read the exact recovered Artcraft runtime dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: storytold/craft-launcher
          ref: ec205366ebe42635e155b9ab246f036052fef406
          path: .ci-donor/artcraft-launcher
          persist-credentials: false
      - name: Build and stage the existing hosted-canvas runtime
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          bash scripts/qualify-artcraft-hosted-donor.sh "$GITHUB_WORKSPACE/.ci-donor/artcraft-launcher" "$GITHUB_WORKSPACE/tools/artcraft-launcher/lifecycle.patch" "$RUNNER_TEMP/hex-artcraft-hosted-donor"
          node --test tests/artcraft-runtime-stage.test.mjs
          node scripts/stage-artcraft-runtime.mjs
          test -s public/donor/artcraft-launcher-web/launcher.js
          test -s public/donor/artcraft-launcher-web/launcher_bg.wasm
      - name: Retain existing capture refusals and qualify content-readiness evidence
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/verify-hex-capture.py --check-decoder
          /usr/bin/python3 -I -B tests/hex-capture.test.py
          /usr/bin/python3 -I -B tests/hex-library-capture.test.py
          /usr/bin/python3 -I -B tests/extracted-artcraft.test.py
      - name: Build exact-source Tauri and Debian, no DEV9 carrier fallback
        run: |
          set -euo pipefail
          npm run native:build
          test -x native/hex/carrier/src-tauri/target/release/xi-io-hex-dev
          shopt -s nullglob
          debs=(native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum "${debs[0]}" | tee maths-native-deb.sha256
          dpkg-deb --contents "${debs[0]}" > maths-deb.contents
          grep -F 'xi-io-hex-dev' maths-deb.contents >/dev/null
      - name: Retain the actual frontend consumed by this native package
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          tar -C dist -czf hex-built-frontend.tgz .
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          def files(directory):
              out={}
              for p in sorted(directory.rglob('*')):
                  assert not p.is_symlink(),'FRONTEND_SYMLINK_REFUSED'
                  if p.is_file():out[str(p.relative_to(directory))]={'bytes':p.stat().st_size,'sha256':sha(p)}
              assert 'index.html' in out and len(out)>1,'FRONTEND_FILES_MISSING'
              return out
          frontend=files(root/'dist')
          assert frontend==files(root/'native/hex/carrier/frontend'),'STAGED_FRONTEND_MISMATCH'
          for asset in ('launcher.js','launcher_bg.wasm','LICENSE-APACHE','LICENSE-MIT','NOTICE','ATTRIBUTION.md','OFL-Inter.txt','OFL-Archivo.txt','OFL-GeistMono.txt'):
              assert 'donor/artcraft-launcher-web/'+asset in frontend,'ARTCRAFT_PACKAGED_ASSET_MISSING'
          debs=list(root.glob('native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb'))
          assert len(debs)==1,'ONE_NATIVE_PACKAGE_REQUIRED'
          elf=root/'native/hex/carrier/src-tauri/target/release/xi-io-hex-dev'
          os_release={}
          for line in pathlib.Path('/etc/os-release').read_text().splitlines():
              if '=' in line:
                  key,value=line.split('=',1)
                  if key in ('ID','VERSION_ID','PRETTY_NAME'):os_release[key]=value.strip('"')
          receipt={
              'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'github_sha':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],
              'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'package_version':subprocess.check_output(['dpkg-deb','--field',str(debs[0]),'Version'],text=True).strip(),
              'frontend_files':frontend,'frontend_staged_match':True,
              'frontend_archive_sha256':sha(root/'hex-built-frontend.tgz'),
              'native_elf_sha256':sha(elf),'debian_package_sha256':sha(debs[0]),
              'debian_package_name':debs[0].name,'build_os':os_release,
              'artcraft_recovery':{
                  'cube_provider_revision':'86af5948722aefe2cf562e0efbe6c4373418f2ef',
                  'runtime_source_revision':'ec205366ebe42635e155b9ab246f036052fef406',
                  'lifecycle_patch_git_blob':'0e09a389078baa8ddf9750313727c1eaa5300b5b',
                  'xiio_profile_patch_git_blob':subprocess.check_output(['git','hash-object','tools/artcraft-launcher/xiio-catalog.patch'],text=True).strip(),
                  'hosted_profile':'xiio-hex',
                  'body_git_blob':subprocess.check_output(['git','hash-object','src/components/ArtcraftLauncherBody.tsx'],text=True).strip(),
                  'later_aries_revision_verified':False},
              'qualification':'BUILT_FRONTEND_NOT_INSTALLED_ACCEPTANCE',
              'pop_os_acceptance':False,'release_promotion':False}
          (root/'hex-native-frontend-identity.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
          sha256sum hex-built-frontend.tgz hex-native-frontend-identity.json | tee hex-frontend-artifacts.sha256
      - name: Install actual candidate on disposable Linux and observe running window
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          shopt -s nullglob
          debs=(native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum --check maths-native-deb.sha256
          sudo dpkg -i "${debs[0]}"
          dpkg-query -S /usr/bin/xi-io-hex-dev
          test -x /usr/bin/xi-io-hex-dev
          sha256sum /usr/bin/xi-io-hex-dev | tee maths-installed-elf.sha256
          cmp /usr/bin/xi-io-hex-dev native/hex/carrier/src-tauri/target/release/xi-io-hex-dev
          export HEX_BUILD_SOURCE="$(git rev-parse HEAD)"
          export HEX_INSTALLED_ELF_SHA="$(sha256sum /usr/bin/xi-io-hex-dev | cut -d' ' -f1)"
          export HEX_FRONTEND_IDENTITY="$GITHUB_WORKSPACE/hex-native-frontend-identity.json"
          export HEX_CANDIDATE_PACKAGE="$GITHUB_WORKSPACE/${debs[0]}"
          work="$(mktemp -d "${RUNNER_TEMP}/hex-maths-window.XXXXXXXX")"
          mkdir -p "$work/home" "$work/config" "$work/data" "$work/state" "$work/cache" "$work/runtime" "$work/tmp"
          chmod 0700 "$work"/{home,config,data,state,cache,runtime,tmp}
          export MATHS_WINDOW_WORK="$work"
          set +e
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -euo pipefail -c '
            export HOME="$MATHS_WINDOW_WORK/home"
            export XDG_CONFIG_HOME="$MATHS_WINDOW_WORK/config"
            export XDG_DATA_HOME="$MATHS_WINDOW_WORK/data"
            export XDG_STATE_HOME="$MATHS_WINDOW_WORK/state"
            export XDG_CACHE_HOME="$MATHS_WINDOW_WORK/cache"
            export XDG_RUNTIME_DIR="$MATHS_WINDOW_WORK/runtime"
            export TMPDIR="$MATHS_WINDOW_WORK/tmp"
            export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=0
            # Same isolated WebKit-default observation mode as Cube #27.
            # Do not force the old disabled-compositor prepaint path.
            unset WEBKIT_DISABLE_COMPOSITING_MODE WEBKIT_DISABLE_DMABUF_RENDERER
            timeout 5s gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress >/dev/null 2>&1 || true
            /usr/bin/xi-io-hex-dev >"$MATHS_WINDOW_WORK/stdout.log" 2>"$MATHS_WINDOW_WORK/stderr.log" &
            pid=$!
            trap '\''kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true'\'' EXIT
            for i in $(seq 1 80); do
              kill -0 "$pid" || { cat "$MATHS_WINDOW_WORK/stderr.log"; exit 31; }
              window=$(xdotool search --onlyvisible --pid "$pid" --name "^XI-IO HEX$" 2>/dev/null | head -n1 || true)
              test -z "$window" || break
              sleep 0.25
            done
            test -n "${window:-}" || { cat "$MATHS_WINDOW_WORK/stderr.log"; exit 32; }
            test "$(xdotool getwindowpid "$window")" = "$pid"
            test "$(xdotool getwindowname "$window")" = "XI-IO HEX"
            set +e
            timeout --signal=KILL 115s /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/verify-extracted-artcraft.py" \
              --installed "$pid" "$window" "$HEX_INSTALLED_ELF_SHA" "$HEX_BUILD_SOURCE" "$MATHS_WINDOW_WORK" /usr/bin/xi-io-hex-dev "$HEX_CANDIDATE_PACKAGE" "$HEX_FRONTEND_IDENTITY"
            observed=$?
            set -e
            if test "$observed" -ne 0; then
              # Failure-only image is retained for review, never promoted.
              scrot -z -o "$MATHS_WINDOW_WORK/software-unqualified.png" || true
              exit "$observed"
            fi
            test -s "$MATHS_WINDOW_WORK/software-initialized.png"
            test -e "$MATHS_WINDOW_WORK/home"
          '
          observed=$?
          set -e
          for name in software-initialization.json software-initialized.png software-initialized-owned-window.png software-initialized-owned-window.ocr.txt software-initialized-owned-window.layout.ocr.txt software-initialized-attempts.json software-unverified.png software-unqualified.png; do
            if test -f "$work/$name"; then cp "$work/$name" "$name"; fi
          done
          if test -d "$work/software-initialized-attempts"; then
            test ! -e software-initialized-attempts && test ! -L software-initialized-attempts
            cp -R -- "$work/software-initialized-attempts" software-initialized-attempts
          fi
          if test -f "$work/stderr.log"; then cp "$work/stderr.log" maths-installed-window.stderr.log; fi
          if test -f "$work/stdout.log"; then cp "$work/stdout.log" maths-installed-window.stdout.log; fi
          test "$observed" -eq 0 || exit "$observed"
          cp software-initialized.png maths-installed-window.png
          sha256sum maths-installed-window.png | tee maths-installed-window.sha256
          printf 'SOURCE=%s\nARTCRAFT_RUNTIME_INITIALIZATION_OBSERVED=true\nNATIVE_MATHS_CLICK_READBACK=NOT_VERIFIED\nPOP_OS_ACCEPTANCE=NOT_PERFORMED\nARIES_INSTALL=NOT_PERFORMED\n' "$HEX_BUILD_SOURCE"
      - name: Install two downloaded products through one installed HEX window
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum --check maths-native-deb.sha256
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=0
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- \
            timeout --signal=KILL 180s /usr/bin/python3 -I -B scripts/verify-installed-product-folders.py \
            --package "${debs[0]}" --proof "$GITHUB_WORKSPACE/hex-installed-products.json"
      - name: Refuse the actual released DEV12 catalog with the same content observer
        if: always()
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          work="$(mktemp -d "${RUNNER_TEMP}/hex-dev12-retired-ui.XXXXXXXX")"
          export HEX_DEV12_PROOF="$work"
          set +e
          (
            set -euo pipefail
            printf '%s\n' DOWNLOAD_EXACT_RELEASED_DEV12 > "$work/stage.txt"
            package="$work/xi-io-hex-dev_0.1.0-dev.12_amd64.deb"
            curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 \
              'https://github.com/Vado42-chris/xi-io-cli-cube/releases/download/xiio-hex-local-d160521c-dev12/xi-io-hex-dev_0.1.0-dev.12_amd64.deb' \
              --output "$package"
            printf '%s  %s\n' '07115547bd5603882eca5f2b31593615162e6ae1e1573c8b2a8635245337c700' "$package" | sha256sum --check
            sha256sum "$package" > "$work/hex-dev12-package.sha256"
            printf '%s\n' EXTRACT_EXACT_RELEASED_DEV12 > "$work/stage.txt"
            mkdir "$work/payload"
            dpkg-deb -x "$package" "$work/payload"
            executable="$work/payload/usr/bin/xi-io-hex-dev"
            test -x "$executable"
            printf '%s  %s\n' 'ea5059196651e3100ee0f08393de09337859d72c34fc629fd2292f45d00f4b12' "$executable" | sha256sum --check
            # Extraction only. The old package never replaces the installed candidate.
            mkdir -p "$work/home" "$work/config" "$work/data" "$work/state" "$work/cache" "$work/runtime" "$work/tmp"
            chmod 0700 "$work"/{home,config,data,state,cache,runtime,tmp}
            printf '%s\n' LAUNCH_EXACT_RELEASED_DEV12 > "$work/stage.txt"
            xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -euo pipefail -c '
              export HOME="$HEX_DEV12_PROOF/home"
              export XDG_CONFIG_HOME="$HEX_DEV12_PROOF/config"
              export XDG_DATA_HOME="$HEX_DEV12_PROOF/data"
              export XDG_STATE_HOME="$HEX_DEV12_PROOF/state"
              export XDG_CACHE_HOME="$HEX_DEV12_PROOF/cache"
              export XDG_RUNTIME_DIR="$HEX_DEV12_PROOF/runtime"
              export TMPDIR="$HEX_DEV12_PROOF/tmp"
              export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=0
              unset WEBKIT_DISABLE_COMPOSITING_MODE WEBKIT_DISABLE_DMABUF_RENDERER
              timeout 5s gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress >/dev/null 2>&1 || true
              executable="$HEX_DEV12_PROOF/payload/usr/bin/xi-io-hex-dev"
              package="$HEX_DEV12_PROOF/xi-io-hex-dev_0.1.0-dev.12_amd64.deb"
              "$executable" >"$HEX_DEV12_PROOF/stdout.log" 2>"$HEX_DEV12_PROOF/stderr.log" &
              pid=$!
              trap '\''kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true'\'' EXIT
              for i in $(seq 1 80); do
                kill -0 "$pid" || { cat "$HEX_DEV12_PROOF/stderr.log"; exit 41; }
                window=$(xdotool search --onlyvisible --pid "$pid" --name "^XI-IO HEX$" 2>/dev/null | head -n1 || true)
                test -z "$window" || break
                sleep 0.25
              done
              test -n "${window:-}" || { cat "$HEX_DEV12_PROOF/stderr.log"; exit 42; }
              printf "%s\n" OBSERVE_RETIRED_CATALOG_AND_CURRENT_SELECTOR_REFUSAL > "$HEX_DEV12_PROOF/stage.txt"
              set +e
              timeout --signal=KILL 115s /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/verify-extracted-artcraft.py" \
                --retired-dev12 "$pid" "$window" "$GITHUB_SHA" "$HEX_DEV12_PROOF" "$executable" "$package"
              observed=$?
              set -e
              if test "$observed" -ne 0; then
                scrot -z -o "$HEX_DEV12_PROOF/hex-dev12-unqualified.png" || true
                exit "$observed"
              fi
              test -s "$HEX_DEV12_PROOF/software-retired-dev12.png"
            '
          ) > "$work/hex-dev12-executor.log" 2>&1
          observed=$?
          set -e
          export HEX_DEV12_EXIT="$observed"
          # A missing tool/download/window or interrupted observer is an executor
          # failure. Preserve it without inventing a successful negative control.
          /usr/bin/python3 -I -B - <<'PY'
          import json,os,pathlib
          proof=pathlib.Path(os.environ['HEX_DEV12_PROOF'])
          receipt=proof/'hex-dev12-ui-red.json'
          if not receipt.exists():
              receipt.write_text(json.dumps({
                  'state':'RELEASED_RETIRED_UI_RED_UNVERIFIED','red_established':False,
                  'release_tag':'xiio-hex-local-d160521c-dev12',
                  'expected_debian_package_sha256':'07115547bd5603882eca5f2b31593615162e6ae1e1573c8b2a8635245337c700',
                  'candidate_verifier_source':os.environ['GITHUB_SHA'],
                  'execution_failure':'DEV12_EXECUTOR_FAILED_BEFORE_OBSERVER_RETURN',
                  'first_unmet_stage':(proof/'stage.txt').read_text().strip(),
                  'exit_status':int(os.environ['HEX_DEV12_EXIT']),
                  'physical_target':'GITHUB_HOSTED_UBUNTU_22_04_XVFB_EXTRACTED_PACKAGE',
                  'package_installed':False,'pop_os_acceptance':False,
                  'product_install_actions_performed':False,'release_promotion':False},indent=2)+'\n')
          PY
          for name in hex-dev12-ui-red.json software-retired-dev12.png software-retired-dev12-owned-window.png software-retired-dev12-owned-window.ocr.txt software-retired-dev12-owned-window.layout.ocr.txt software-retired-dev12-attempts.json software-retired-dev12-unverified.png hex-dev12-unqualified.png hex-dev12-executor.log hex-dev12-package.sha256; do
            if test -f "$work/$name"; then cp "$work/$name" "$name"; fi
          done
          if test -d "$work/software-retired-dev12-attempts"; then
            test ! -e software-retired-dev12-attempts && test ! -L software-retired-dev12-attempts
            cp -R -- "$work/software-retired-dev12-attempts" software-retired-dev12-attempts
          fi
          if test -f "$work/stderr.log"; then cp "$work/stderr.log" hex-dev12-native.stderr.log; fi
          if test -f "$work/stdout.log"; then cp "$work/stdout.log" hex-dev12-native.stdout.log; fi
          cat hex-dev12-executor.log
          test "$observed" -eq 0 || exit "$observed"
      - name: Preserve package and source-bound hosted acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-snap55-hosted-native-${{ github.sha }}
          path: |
            native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb
            maths-native-deb.sha256
            maths-installed-elf.sha256
            maths-installed-window.sha256
            maths-installed-window.png
            maths-installed-window.stderr.log
            maths-installed-window.stdout.log
            maths-deb.contents
            hex-built-frontend.tgz
            hex-native-frontend-identity.json
            hex-installed-products.json
            hex-frontend-artifacts.sha256
            hex-ocr-identity.json
            hex-ocr-toolchain.tgz
            software-initialization.json
            software-initialized.png
            software-initialized-owned-window.png
            software-initialized-owned-window.ocr.txt
            software-initialized-owned-window.layout.ocr.txt
            software-initialized-attempts.json
            software-initialized-attempts/
            software-unverified.png
            software-unqualified.png
            hex-dev12-ui-red.json
            software-retired-dev12.png
            software-retired-dev12-owned-window.png
            software-retired-dev12-owned-window.ocr.txt
            software-retired-dev12-owned-window.layout.ocr.txt
            software-retired-dev12-attempts.json
            software-retired-dev12-attempts/
            software-retired-dev12-unverified.png
            hex-dev12-unqualified.png
            hex-dev12-executor.log
            hex-dev12-package.sha256
            hex-dev12-native.stderr.log
            hex-dev12-native.stdout.log
          if-no-files-found: warn
          retention-days: 14

  framework-release-physical-chain:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact HEX consumer and pinned Framework fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Verify exact accepted Framework owner bytes and hostile substitution refusal
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest native.hex.adapter.test_framework_physical_chain_fixture -v
      - name: Install and bind exact Framework 1551 bytes through the embedded Installer
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/framework-physical"
          fixture="$GITHUB_WORKSPACE/native/hex/fixtures/framework-runtime-cfe2776"
          mkdir -p "$work"/{config,data,state,cache,receipts}
          chmod 0700 "$work"/{config,data,state,cache,receipts}
          export XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" XDG_STATE_HOME="$work/state" XDG_CACHE_HOME="$work/cache"
          export XIIO_FRAMEWORK_FIXTURE="$fixture" XIIO_FRAMEWORK_WORK="$work"
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('native/hex/adapter/kernel').resolve()))
          from xiio_installer.manifest import load_manifest
          from xiio_installer.dependency_binding import bind_dependency_manifest
          from xiio_installer.dependency_receipt_verification import verify_dependency_binding_receipt
          fixture=Path(os.environ['XIIO_FRAMEWORK_FIXTURE'])
          work=Path(os.environ['XIIO_FRAMEWORK_WORK'])
          env={key:os.environ[key] for key in ('XDG_CONFIG_HOME','XDG_DATA_HOME','XDG_STATE_HOME','XDG_CACHE_HOME')}
          generation='cfe2776b08e1768882f95884fd52576e48f0550c'
          manifest=load_manifest(fixture/'framework-runtime.manifest.json')
          receipt=bind_dependency_manifest(
              manifest,fixture,work/'receipts/install.json',work/'receipts/binding.json',
              expected_dependency_id='framework-runtime',
              expected_owner_repo='Vado42-chris/xi-io.net',
              expected_generation=generation,env=env)
          reopened=verify_dependency_binding_receipt(
              work/'receipts/binding.json',
              expected_dependency_id='framework-runtime',
              expected_owner_repo='Vado42-chris/xi-io.net',
              expected_generation=generation)
          assert receipt['state']=='BOUND'
          assert reopened['state']=='VERIFIED' and reopened['custody_verified'] is True
          for key in ('dependency_id','owner_repo','accepted_generation','binding_receipt_path','runtime_exports','fields','provider_effect','effect_authority'):
              assert receipt[key]==reopened[key]
          assert set(reopened['runtime_exports'])=={'current_assignment_module','release_distribution_module'}
          PY
      - name: Produce durable authority using the installed Framework runtime
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/framework-physical"
          export XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" XDG_STATE_HOME="$work/state" XDG_CACHE_HOME="$work/cache"
          runtime="$XDG_DATA_HOME/xi-io/framework/runtime"
          lock="$work/product.lock"
          printf 'hosted physical release lock\n' > "$lock"
          export XIIO_FRAMEWORK_RUNTIME="$runtime" XIIO_LOCK_SHA="$(sha256sum "$lock" | awk '{print $1}')"
          node --input-type=module - <<'NODE'
          import {pathToFileURL} from 'node:url';
          import path from 'node:path';
          const runtime=process.env.XIIO_FRAMEWORK_RUNTIME;
          const generation='cfe2776b08e1768882f95884fd52576e48f0550c';
          const product='product:hosted-framework-canary';
          const consumer='consumer:hex-hosted';
          const {produceDurableReleaseAuthority}=await import(pathToFileURL(path.join(runtime,'release-authority-producer.mjs')));
          const result=await produceDurableReleaseAuthority({
            release:{lifecycle:'DISTRIBUTABLE',release_ref:'release:hosted:1',product_ref:product,release_generation:generation,approved_lock_sha256:process.env.XIIO_LOCK_SHA,provider_hosts:['releases.example.com'],artifact_refs:['artifact:framework-runtime'],manifest_refs:['manifest:framework-runtime']},
            release_qualification:{current:true,qualified:true,qualification_ref:'release-qual:hosted:1',product_ref:product,release_generation:generation,approved_lock_sha256:process.env.XIIO_LOCK_SHA},
            adopter:{adopter_lock_ref:'adopter:hex-hosted:1',consumer_ref:consumer,product_ref:product,release_ref:'release:hosted:1',release_generation:generation,approved_lock_sha256:process.env.XIIO_LOCK_SHA},
            currentness:{current:true,adopter_lock_ref:'adopter:hex-hosted:1',release_ref:'release:hosted:1',release_generation:generation,consumer_ref:consumer,currentness_ref:'current:hosted:1'},
            artifact_root:runtime,artifact_generation:generation,
            entrypoints:[{path:'release-distribution-reader.mjs',runtime:'node'}],
            product_ref:product,observed_at:'2026-11-17T16:00:00Z'
          });
          if(result.state!=='DURABLE_REOPEN_VERIFIED')throw Error('FRAMEWORK_DURABLE_AUTHORITY_NOT_REOPENED');
          NODE
      - name: Resolve the installed export and invoke the Framework reader through HEX
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/framework-physical"
          export XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" XDG_STATE_HOME="$work/state" XDG_CACHE_HOME="$work/cache"
          export XIIO_FRAMEWORK_WORK="$work" XIIO_HEX_SOURCE="$GITHUB_SHA"
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          sys.path.insert(0,str(Path('native/hex/adapter/kernel').resolve()))
          from native.hex.adapter.framework_release_export import resolve_framework_release_distribution_module
          from native.hex.adapter.framework_release_reader import build_framework_release_distribution_reader
          work=Path(os.environ['XIIO_FRAMEWORK_WORK'])
          generation='cfe2776b08e1768882f95884fd52576e48f0550c'
          binding=work/'receipts/binding.json'
          export=resolve_framework_release_distribution_module(binding,expected_framework_generation=generation)
          reader=build_framework_release_distribution_reader(
              framework_release_distribution_module=Path(export['release_distribution_module']))
          result=reader(product_ref='product:hosted-framework-canary',consumer_ref='consumer:hex-hosted')
          assert result['schema']=='xiio.release-distribution-lock/v1'
          assert result['release_generation']==generation
          assert result['adopter_current'] is True
          assert result['effect_authority'] is False and result['installed'] is False
          assert isinstance(result['entrypoint_qualification_ref'],str) and result['entrypoint_qualification_ref']
          proof={
              'schema':'xiio.hex.framework-physical-consumer-proof/v1',
              'state':'INSTALLED_EXPORT_READER_REOPEN_VERIFIED',
              'hex_source':os.environ['XIIO_HEX_SOURCE'],
              'framework_owner_ref':generation,
              'binding_receipt_sha256':hashlib.sha256(binding.read_bytes()).hexdigest(),
              'release_distribution':result,
              'effect_authority':False,'provider_effect':False,'billing_effect_authority':False,
              'physical_target':'GITHUB_HOSTED_DISPOSABLE_LINUX',
              'aries_or_loki':False,'return_applied':False,'restart_reopen_product_transaction':False,
          }
          (work/'framework-physical-proof.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('FRAMEWORK_PHYSICAL_RELEASE_READER_PASS')
          PY
      - name: Preserve the installed binding and independent reader proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-physical-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/framework-physical/receipts/*.json
            ${{ runner.temp }}/framework-physical/state/xi-io/framework/release-readback/*.json
            ${{ runner.temp }}/framework-physical/framework-physical-proof.json
          if-no-files-found: error
          retention-days: 14
