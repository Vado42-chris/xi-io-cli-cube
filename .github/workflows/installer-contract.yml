name: XI-IO CLI Cube static contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Run source/parser regressions and explicitly labeled simulations
        run: |
          npm test
          npm run test:bindings
          npm run test:source-adoption
      - name: Qualify exact DEV9 bootstrap and guarded delivery
        run: |
          set -euo pipefail
          python3 deliveries/hex-dev/0.1.0-dev.9/qualification/test_bootstrap.py
      - name: Audit actual page and release configuration
        run: npm run test:contract

  bundled-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install exact locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and bundle
        run: |
          npm run lint
          npm run build
      - name: Verify real product navigation and shared-frame consumer
        run: npm run test:interaction
      - name: Refuse generated server entrypoint or remote script tag
        run: |
          test -f dist/index.html
          test ! -e dist/server.js
          if grep -Ein '<(script|link)[^>]+(src|href)="https?://' dist/index.html; then
            echo "EXTERNAL_SCRIPT_OR_STYLESHEET_NOT_OFFLINE"
            exit 1
          fi
          echo "SOURCE_BUILD_PASS_NOT_HOST_INSTALL"

  native-source-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact editable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install native build dependencies in the disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf python3
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Build the same root product frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
      - name: Test actual finite adapter and native carrier from editable sources
        run: npm run native:check
      - name: Keep source qualification distinct from installed device acceptance
        run: echo "SOURCE_NATIVE_TESTS_NOT_ARIES_INSTALL_OR_CONNECTION"
