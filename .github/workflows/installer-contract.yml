name: XI-IO CLI Cube static contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_candidate_artifact:
        description: 'Explicit owner-reviewed public HEX candidate upload, not a release or installation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Cancel superseded PR pushes rather than spending multiple 45-minute Rust builds.
concurrency:
  group: xiio-cube-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Reject unsafe binary upload gates before source build
        run: node --test tests/native-ci-artifact-guards.test.mjs
      - name: Run source/parser regressions and explicitly labeled simulations
        run: |
          npm test
          npm run test:bindings
          npm run test:source-adoption
      - name: Qualify exact DEV9 bootstrap and guarded delivery
        run: |
          set -euo pipefail
          python3 deliveries/hex-dev/0.1.0-dev.9/qualification/test_bootstrap.py
      - name: Audit actual page and release configuration
        run: npm run test:contract

  bundled-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install exact locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and bundle
        run: |
          npm run lint
          npm run build
      - name: Verify real product navigation and shared-frame consumer
        run: npm run test:interaction
      - name: Refuse generated server entrypoint or remote script tag
        run: |
          test -f dist/index.html
          test ! -e dist/server.js
          if grep -Ein '<(script|link)[^>]+(src|href)="https?://' dist/index.html; then
            echo "EXTERNAL_SCRIPT_OR_STYLESHEET_NOT_OFFLINE"
            exit 1
          fi
          echo "SOURCE_BUILD_PASS_NOT_HOST_INSTALL"

  native-source-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact editable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install native build dependencies in the disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf python3
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Build the same root product frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
      - name: Test actual finite adapter and native carrier from editable sources
        run: npm run native:check
      - name: Keep source qualification distinct from installed device acceptance
        run: echo "SOURCE_NATIVE_TESTS_NOT_ARIES_INSTALL_OR_CONNECTION"

  installed-linux-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact version-pinned DEV9 Debian package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1 for the installed native client parser
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Fail closed outside an ephemeral GitHub Linux runner
        run: |
          set -euo pipefail
          bash -n deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh
          set +e
          GITHUB_ACTIONS=false bash deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh > guard.log 2>&1
          status=$?
          set -e
          test "$status" -eq 78
          grep -Fxq CI_EPHEMERAL_RUNNER_REQUIRED guard.log
      - name: Install, independently reopen and remove actual DEV9 package on disposable Linux
        run: bash deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh

  child-bundle-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable code and existing installer kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify child manifest downloader, real XDG transactions and hostile rollback
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s native/hex/adapter -p test_bundle.py -v
      - name: Keep composed payload installation distinct from running product/remote authority
        run: |
          echo "CHILD_BUNDLE_SOURCE_AND_DISPOSABLE_FILESYSTEM_TEST_ONLY"
          echo "RUNNING_SERVICES=NOT_TESTED"
          echo "FIRST_PARTY_SESSION_AND_WARD=UNBOUND"
          echo "CUSTOMER_TWO_WAY_CONNECTION=NOT_PROVEN"

  maths-installed-window:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact HEX maths generation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 24.22.1 for reproducible frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Qualify byte-identical maths and actual bundled DOM interaction
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/snap55-desktop.test.mjs
          npm run lint
          npm run build
          npm run test:interaction
          grep -Rq 'data-hex-snap55-workbench' dist/assets
      - name: Install native build and isolated GUI toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf python3 libayatana-appindicator3-dev xvfb xdotool scrot dbus-x11 python3-pil
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          npm ci --prefix native/hex/carrier --no-audit --no-fund
      - name: Build exact-source Tauri and Debian, no DEV9 carrier fallback
        run: |
          set -euo pipefail
          npm run native:build
          test -x native/hex/carrier/src-tauri/target/release/xi-io-hex-dev
          shopt -s nullglob
          debs=(native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum "${debs[0]}" | tee maths-native-deb.sha256
          dpkg-deb --contents "${debs[0]}" > maths-deb.contents
          grep -F 'xi-io-hex-dev' maths-deb.contents >/dev/null
      - name: Install actual candidate on disposable Linux and observe running window
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          shopt -s nullglob
          debs=(native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum --check maths-native-deb.sha256
          sudo dpkg -i "${debs[0]}"
          dpkg-query -S /usr/bin/xi-io-hex-dev
          test -x /usr/bin/xi-io-hex-dev
          sha256sum /usr/bin/xi-io-hex-dev | tee maths-installed-elf.sha256
          work="$(mktemp -d "${RUNNER_TEMP}/hex-maths-window.XXXXXXXX")"
          mkdir -p "$work/home" "$work/config" "$work/data" "$work/state" "$work/cache" "$work/runtime" "$work/tmp"
          chmod 0700 "$work"/{home,config,data,state,cache,runtime,tmp}
          export MATHS_WINDOW_WORK="$work"
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -euo pipefail -c '
            export HOME="$MATHS_WINDOW_WORK/home"
            export XDG_CONFIG_HOME="$MATHS_WINDOW_WORK/config"
            export XDG_DATA_HOME="$MATHS_WINDOW_WORK/data"
            export XDG_STATE_HOME="$MATHS_WINDOW_WORK/state"
            export XDG_CACHE_HOME="$MATHS_WINDOW_WORK/cache"
            export XDG_RUNTIME_DIR="$MATHS_WINDOW_WORK/runtime"
            export TMPDIR="$MATHS_WINDOW_WORK/tmp"
            export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
            /usr/bin/xi-io-hex-dev >"$MATHS_WINDOW_WORK/stdout.log" 2>"$MATHS_WINDOW_WORK/stderr.log" &
            pid=$!
            trap '\''kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true'\'' EXIT
            deadline=$((SECONDS + 60))
            for i in $(seq 1 120); do
              (( SECONDS < deadline )) || { echo HEX_GUI_OBSERVATION_DEADLINE; exit 32; }
              kill -0 "$pid" || { cat "$MATHS_WINDOW_WORK/stderr.log"; exit 31; }
              window=$(timeout -k 1 2 xdotool search --onlyvisible --pid "$pid" --name "^XI-IO HEX$" 2>/dev/null | head -n1 || true)
              test -z "$window" || break
              sleep 0.25
            done
            test -n "${window:-}" || { cat "$MATHS_WINDOW_WORK/stderr.log"; exit 32; }
            # Bound every capture/decoder by the remaining common deadline.
            capture_command() {
              local budget=$1 remaining=$((deadline - SECONDS)); shift
              (( remaining > 0 )) || return 124
              (( budget <= remaining )) || budget=$remaining
              timeout --signal=KILL "${budget}s" "$@"
            }
            painted=0
            for attempt in $(seq 1 12); do
              (( SECONDS < deadline )) || { echo HEX_GUI_OBSERVATION_DEADLINE; exit 32; }
              kill -0 "$pid" || { echo HEX_GUI_PROCESS_EXITED; exit 31; }
              test "$(capture_command 2 xdotool getwindowpid "$window")" = "$pid"
              test "$(capture_command 2 xdotool getwindowname "$window")" = "XI-IO HEX"
              if capture_command 3 scrot -z "$MATHS_WINDOW_WORK/installed-window.png" &&
                 capture_command 3 python3 -I -B "$GITHUB_WORKSPACE/scripts/verify-hex-capture.py" "$MATHS_WINDOW_WORK/installed-window.png" > "$MATHS_WINDOW_WORK/visual.json" 2> "$MATHS_WINDOW_WORK/visual.err"; then
                (( SECONDS < deadline )) || { echo HEX_GUI_OBSERVATION_DEADLINE; exit 32; }
                painted=1
                break
              fi
              slots=$((12 - attempt))
              remaining=$((deadline - SECONDS))
              if (( slots > 0 && remaining > 3 )); then
                delay=$(((remaining - 3) / slots))
                if (( delay > 0 )); then
                  capture_command "$remaining" sleep "$delay" || { echo HEX_GUI_OBSERVATION_DEADLINE; exit 32; }
                fi
              fi
            done
            if [ "$painted" != 1 ]; then
              # Public CI, isolated user profile only. Preserve the rejected
              # screenshot and checker code for independent hostile review.
              cp "$MATHS_WINDOW_WORK/installed-window.png" "$GITHUB_WORKSPACE/maths-installed-window.png" 2>/dev/null || true
              cp "$MATHS_WINDOW_WORK/visual.err" "$GITHUB_WORKSPACE/maths-installed-window-visual.err" 2>/dev/null || true
              echo HEX_INSTALLED_WINDOW_BLANK_OR_PREPAINT >&2
              tail -n 10 "$MATHS_WINDOW_WORK/visual.err" >&2 2>/dev/null || true
              exit 36
            fi
            test -e "$MATHS_WINDOW_WORK/home"
          '
          cp "$work/installed-window.png" maths-installed-window.png
          cp "$work/visual.json" maths-installed-window-visual.json
          cp "$work/stderr.log" maths-installed-window.stderr.log
          sha256sum maths-installed-window.png | tee maths-installed-window.sha256
          printf 'SOURCE=%s\nINSTALLED_WINDOW_OBSERVED=true\nVISIBLE_PIXELS_OBSERVED=true\nSEMANTIC_UI_VERIFIED=false\nNATIVE_MATHS_CLICK_READBACK=NOT_VERIFIED\nARIES_INSTALL=NOT_PERFORMED\n' "$GITHUB_SHA"
      - name: Preserve bounded maths/source observations without candidate binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-snap55-hosted-proof-${{ github.sha }}
          path: |
            maths-native-deb.sha256
            maths-installed-elf.sha256
            maths-installed-window.sha256
            maths-installed-window.png
            maths-installed-window-visual.json
            maths-installed-window-visual.err
          if-no-files-found: warn
          retention-days: 14
      - name: Gate maths Debian against SAME public runtime distribution policy
        id: maths_distribution_review
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate_artifact == true && github.actor == 'Vado42-chris' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum --check maths-native-deb.sha256
          PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/verify-public-hex-runtime-deb.py --deb "${debs[0]}"
      - name: Upload exact owner-approved maths candidate only on explicit manual dispatch
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_candidate_artifact == true && github.actor == 'Vado42-chris' && steps.maths_distribution_review.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hex-snap55-owner-reviewed-candidate-${{ github.sha }}
          path: |
            native/hex/carrier/src-tauri/target/release/bundle/deb/*.deb
            maths-native-deb.sha256
          if-no-files-found: error
          retention-days: 14
