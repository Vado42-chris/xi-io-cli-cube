name: XI-IO CLI Cube static contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cube-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Run source/parser regressions and explicitly labeled simulations
        run: |
          npm test
          npm run test:bindings
          npm run test:source-adoption
      - name: Qualify exact DEV9 bootstrap and guarded delivery
        run: |
          set -euo pipefail
          python3 deliveries/hex-dev/0.1.0-dev.9/qualification/test_bootstrap.py
      - name: Audit actual page and release configuration
        run: npm run test:contract

  bundled-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install exact locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and bundle
        run: |
          npm run lint
          npm run build
      - name: Verify real product navigation and shared-frame consumer
        run: npm run test:interaction
      - name: Refuse generated server entrypoint or remote script tag
        run: |
          test -f dist/index.html
          test ! -e dist/server.js
          if grep -Ein '<(script|link)[^>]+(src|href)="https?://' dist/index.html; then
            echo "EXTERNAL_SCRIPT_OR_STYLESHEET_NOT_OFFLINE"
            exit 1
          fi
          echo "SOURCE_BUILD_PASS_NOT_HOST_INSTALL"

  native-source-checks:
    needs: [source-contract, child-bundle-kernel]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out exact editable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install native build dependencies in the disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf python3
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Build the same root product frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
      - name: Install pinned native carrier CLI
        run: npm ci --prefix native/hex/carrier --no-audit --no-fund
      - name: Build exact-source native Debian candidate
        run: npm run native:build
      - name: Verify and label immutable candidate bytes
        run: |
          set -euo pipefail
          mapfile -t packages < <(find native/hex/carrier/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | sort)
          test "${#packages[@]}" -eq 1
          mkdir -p native-candidate
          cp "${packages[0]}" native-candidate/
          (cd native-candidate && sha256sum -- *.deb > SHA256SUMS)
          printf 'SOURCE_SHA=%s\nSTATE=UNRELEASED_BUILD_CANDIDATE\nCORE_RELEASE_LOCK=NOT_PUBLISHED\nAUTHORITY_AND_DEVICE_RETURN=NOT_VERIFIED\n' "$GITHUB_SHA" > native-candidate/QUALIFICATION.txt
          dpkg-deb -I "${packages[0]}" > native-candidate/DEBIAN-METADATA.txt
          echo "Native Debian candidate built and hashed. Not a production release."
      - name: Install, independently inspect and remove freshly built Debian candidate
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          mapfile -t packages < <(find native-candidate -maxdepth 1 -type f -name '*.deb' | sort)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "xi-io-hex-dev"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          test ! -e "/usr/lib/XI-IO HEX DEV/adapter/child_bundle.py"
          sudo apt-get --simulate --no-remove install "$deb" > native-candidate/apt-plan.txt
          ! grep -q '^Remv ' native-candidate/apt-plan.txt
          sudo apt-get -y --no-remove install "$deb"
          dpkg-query -W -f='${Status}\n' xi-io-hex-dev | grep -Fx 'install ok installed'
          test -f "/usr/lib/XI-IO HEX DEV/adapter/child_bundle.py"
          test -f "/usr/lib/XI-IO HEX DEV/adapter/test_core_bundle_native.py"
          test -f "/usr/lib/XI-IO HEX DEV/adapter/installer_adapter.py"
          test -z "$(sudo dpkg --verify xi-io-hex-dev)"
          sudo apt-get -y remove xi-io-hex-dev
          ! dpkg-query -W -f='${db:Status-Abbrev}' xi-io-hex-dev 2>/dev/null | grep -q '^ii'
          test ! -e "/usr/lib/XI-IO HEX DEV/adapter/child_bundle.py"
          echo "NATIVE_NEW_CORE_CANDIDATE_INSTALL_READBACK_REMOVE_PASS"
      - name: Retain downloadable candidate for independent Linux review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hex-native-core-source-candidate
          path: native-candidate/
          if-no-files-found: error
          retention-days: 7

  installed-linux-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact version-pinned DEV9 Debian package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use qualified Node 24.22.1 for the installed native client parser
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Fail closed outside an ephemeral GitHub Linux runner
        run: |
          set -euo pipefail
          bash -n deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh
          set +e
          GITHUB_ACTIONS=false bash deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh > guard.log 2>&1
          status=$?
          set -e
          test "$status" -eq 78
          grep -Fxq CI_EPHEMERAL_RUNNER_REQUIRED guard.log
      - name: Install, independently reopen and remove actual DEV9 package on disposable Linux
        run: bash deliveries/hex-dev/0.1.0-dev.9/qualification/test_native_install.sh

  child-bundle-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable code and existing installer kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify child manifest downloader, real XDG transactions and hostile rollback
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s native/hex/adapter -p test_bundle.py -v
      - name: Keep composed payload installation distinct from running product/remote authority
        run: |
          echo "CHILD_BUNDLE_SOURCE_AND_DISPOSABLE_FILESYSTEM_TEST_ONLY"
          echo "RUNNING_SERVICES=NOT_TESTED"
          echo "FIRST_PARTY_SESSION_AND_WARD=UNBOUND"
          echo "CUSTOMER_TWO_WAY_CONNECTION=NOT_PROVEN"
